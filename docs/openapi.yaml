      responses: { '200': { description: ok } }
    post:
      summary: Alta de empresa con suscripción y gerente invitado (perfil ADMIN)
      description: 'Fase 9b: la empresa empieza en PRUEBA durante suscripcion.dias_prueba días, salvo sin_prueba: true (VIGENTE sin vencimiento).'
      security: [{ sesion: [], csrf: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/EmpresaAlta' } } }
      responses:
        '201': { description: Creada; incluye invitacion_gerente }
        '409': { description: NIF o email duplicado }
        '422': { description: PH-VAL-001 }
  /v1/admin/tenants/{id}:
    get:
      summary: Detalle de empresa con sus usuarios de gestión (perfil ADMIN)
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok }, '404': { description: PH-TENANT-001 } }
    patch:
      summary: Datos, estado, plan, ciclo de cobro, límites (perfil ADMIN)
      description: Un cambio de plan o de ciclo cierra la suscripción vigente y abre otra. Con `estado = BAJA` (RF-111, LEG-017) se fija `fecha_baja` y la respuesta incluye `fecha_borrado` (baja + `operacion.dias_borrado_tras_baja` días); la empresa queda en solo lectura y `cli/tenant_purge.php` la borra en esa fecha. Cualquier otro estado reactiva y anula el borrado.
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok } }
  /v1/admin/metrics:
    get:
      summary: Empresas por estado y MRR teórico por plan (perfil ADMIN)
      security: [{ sesion: [] }]
      responses: { '200': { description: ok } }
  /v1/users:
    get:
      summary: Cuentas de gestión de la empresa (perfil GERENTE)
      security: [{ sesion: [] }]
      responses: { '200': { description: ok } }
    post:
      summary: Crear cuenta de RR. HH. e invitar (perfil GERENTE)
      security: [{ sesion: [], csrf: [] }]
      responses: { '201': { description: Creada; incluye invitacion } }
  /v1/users/{id}:
    patch:
      summary: Editar, bloquear o reactivar una cuenta de RR. HH. (perfil GERENTE)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok }, '404': { description: PH-TENANT-001 } }
    delete:
      summary: Baja de la cuenta de RR. HH. (perfil GERENTE)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: Baja realizada } }
  /v1/users/{id}/invitation:
    post:
      summary: Generar un nuevo enlace de invitación (perfil GERENTE)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '201': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Invitacion' } } } } }
  /v1/teams:
    get:
      summary: Equipos de la empresa (GERENTE, RRHH)
      security: [{ sesion: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Equipo' } }
    post:
      summary: Crear equipo (GERENTE)
      security: [{ sesion: [], csrf: [] }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EquipoEntrada' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Equipo' } } } }
        '403': { description: PH-PERM-001 (RRHH) }
        '409': { description: PH-VAL-001 nombre duplicado }
        '422': { description: PH-VAL-001 }
  /v1/teams/{id}:
    patch:
      summary: Editar equipo (GERENTE)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EquipoEntrada' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Equipo' } } } }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 nombre duplicado }
    delete:
      summary: Borrar equipo (GERENTE, borrado lógico)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: Borrado }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 el equipo tiene empleados de alta }
  /v1/employees:
    get:
      summary: Plantilla de la empresa (GERENTE, RRHH)
      security: [{ sesion: [] }]
      parameters:
        - { name: situacion, in: query, schema: { type: string, enum: [ALTA, BAJA, TODAS], default: ALTA } }
        - { name: equipo_id, in: query, schema: { type: integer } }
        - { name: q, in: query, description: Busca en nombre, apellidos, código interno y email, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Empleado' } }
                  meta: { $ref: '#/components/schemas/Paginacion' }
    post:
      summary: Alta de empleado en SIN_ACCESO (GERENTE, RRHH · RF-021)
      security: [{ sesion: [], csrf: [] }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmpleadoEntrada' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Empleado' } } } }
        '409': { description: PH-TENANT-002 límite del plan · PH-VAL-001 email o código interno duplicado }
        '422': { description: PH-VAL-001 }
  /v1/employees/import:
    post:
      summary: Importar la plantilla por CSV, todo o nada (GERENTE, RRHH · RF-020)
      description: |
        Cuerpo: el archivo tal cual, con Content-Type text/csv. UTF-8, separador ";" o ",",
        cabecera en la primera fila, máximo 1 MB y 250 filas.
        Columnas: codigo_interno*, nombre*, apellidos, email, puesto*, tipo_contrato*, turno*,
        fecha_alta* (AAAA-MM-DD o DD/MM/AAAA), equipo (nombre de un equipo existente).
        codigo_interno existente = cambio de la ficha; nuevo = alta en SIN_ACCESO. No crea invitaciones.
        Ejemplo: docs/ejemplos/plantilla_empleados.csv
      security: [{ sesion: [], csrf: [] }]
      parameters:
        - name: simular
          in: query
          description: 1 = valida y devuelve el resumen sin escribir (con errores responde 200 y valido=false)
          schema: { type: string, enum: ['0', '1'] }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '200': { description: Importado o simulado, content: { application/json: { schema: { $ref: '#/components/schemas/ResumenImportacion' } } } }
        '409': { description: PH-TENANT-002 las altas superan el límite del plan }
        '415': { description: PH-VAL-001 el cuerpo no es text/csv }
        '422':
          description: PH-VAL-002 · no se ha importado ninguna fila
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, example: PH-VAL-002 }
                      message: { type: string }
                      details:
                        type: object
                        properties:
                          errores: { type: array, items: { $ref: '#/components/schemas/ErrorCsv' } }
                      correlation_id: { type: string }
  /v1/employees/{id}:
    get:
      summary: Ficha del empleado (GERENTE, RRHH)
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Empleado' } } } }
        '404': { description: PH-TENANT-001 }
    patch:
      summary: Editar la ficha (GERENTE, RRHH)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmpleadoEntrada' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Empleado' } } } }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 empleado dado de baja, email o código duplicado }
        '422': { description: PH-VAL-001 }
    delete:
      summary: Baja laboral (GERENTE, RRHH · RF-022)
      description: No borra al usuario. Le retira el acceso, anula sus invitaciones y deja la ficha en solo lectura.
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha_baja, motivo_baja]
              properties:
                fecha_baja: { type: string, format: date, description: No futura ni anterior al alta }
                motivo_baja: { type: string, enum: [VOLUNTARIA, NO_VOLUNTARIA, FIN_CONTRATO] }
      responses:
        '200': { description: Baja registrada, content: { application/json: { schema: { $ref: '#/components/schemas/Empleado' } } } }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 ya estaba de baja }
        '422': { description: PH-VAL-001 }
  /v1/employees/{id}/invitation:
    post:
      summary: Invitar al empleado (GERENTE, RRHH · RF-023, LEG-016)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, description: Obligatorio si el empleado aún no tiene email }
      responses:
        '201': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Invitacion' } } } }
        '403': { description: PH-TENANT-003 falta el contrato de encargado del tratamiento }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 empleado de baja o email duplicado }
        '422': { description: PH-VAL-001 sin email, cuenta ya activa o bloqueada }
  /v1/employees/{id}/incidents:
    get:
      summary: Incidencias del empleado (GERENTE, RRHH)
      security: [{ sesion: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoIncidencia' } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Incidencia' } }
                  meta: { $ref: '#/components/schemas/Paginacion' }
        '404': { description: PH-TENANT-001 }
    post:
      summary: Registrar una incidencia (GERENTE, RRHH · LEG-012)
      description: La nota no debe contener información médica ni la causa de una ausencia.
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tipo, fecha]
              properties:
                tipo: { $ref: '#/components/schemas/TipoIncidencia' }
                fecha: { type: string, format: date, description: No futura; entre el alta y la baja del empleado }
                nota: { type: string, maxLength: 500 }
      responses:
        '201': { description: Registrada, content: { application/json: { schema: { $ref: '#/components/schemas/Incidencia' } } } }
        '404': { description: PH-TENANT-001 }
        '422': { description: PH-VAL-001 }
  /v1/me/checkins:
    post:
      summary: Check-in del día (EMPLEADO · RF-050, RF-051)
      description: |
        Un check-in por día: repetirlo actualiza el del día (idempotente, apto para la cola sin conexión, RF-062).
        `fecha` permite enviar un check-in hecho sin conexión hasta 3 días después. Voluntario (RF-056).
        La nota se cifra en reposo y no se registra en ningún log.
      security: [{ sesion: [], csrf: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [animo, energia, estres]
              properties:
                animo: { type: integer, minimum: 1, maximum: 5 }
                energia: { type: integer, minimum: 1, maximum: 5 }
                estres: { type: integer, minimum: 1, maximum: 5 }
                nota: { type: string, maxLength: 500 }
                fecha: { type: string, format: date, description: 'Por defecto, hoy (hora de España). No futura ni anterior a 3 días.' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      checkin: { $ref: '#/components/schemas/Checkin' }
                      actualizado: { type: boolean }
                      apoyo: { $ref: '#/components/schemas/Apoyo' }
        '200': { description: Actualizado el check-in del día (misma forma que 201) }
        '403': { description: PH-PERM-001 (no es empleado) · PH-PLAN-001 · PH-AUTH-003 }
        '422': { description: PH-VAL-001 }
    get:
      summary: Historial propio (EMPLEADO · RF-052)
      security: [{ sesion: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30, minimum: 7, maximum: 90 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Checkin' } }
                  meta:
                    type: object
                    properties:
                      dias: { type: integer }
                      hoy: { type: string, format: date }
                      hecho_hoy: { type: boolean }
                      respuestas: { type: integer }
                      racha: { type: integer, description: Días seguidos con check-in }
                      medias:
                        type: [object, 'null']
                        properties:
                          animo: { type: number }
                          energia: { type: number }
                          estres: { type: number }
                          indice: { type: integer }
  /v1/wellbeing/summary:
    get:
      summary: Bienestar agregado y anónimo (GERENTE, RRHH · RF-053, LEG-002)
      description: |
        Medias semanales de la empresa o de un equipo. Nunca devuelve registros individuales ni notas.
        Si ninguna semana llega a 5 personas, `data.actual` es null y `meta.aviso.code` = PH-WB-001.
      security: [{ sesion: [] }]
      parameters:
        - { name: team_id, in: query, schema: { type: integer } }
        - { name: weeks, in: query, schema: { type: integer, default: 8, minimum: 4, maximum: 26 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ResumenBienestar' }
                  meta:
                    type: object
                    properties:
                      semanas: { type: integer }
                      desde: { type: string, format: date }
                      hasta: { type: string, format: date }
                      aviso:
                        type: object
                        properties:
                          code: { type: string, example: PH-WB-001 }
                          message: { type: string }
        '403': { description: PH-PERM-001 · PH-PLAN-001 }
        '404': { description: PH-TENANT-001 (equipo de otra empresa) }
  /v1/training/modules:
    get:
      summary: Catálogo de la empresa (GERENTE, RRHH · RF-040)
      description: Catálogo global publicado y módulos propios (sin archivados salvo que se pidan), con su uso en la empresa.
      security: [{ sesion: [] }]
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Categoria' } }
        - { name: level, in: query, schema: { $ref: '#/components/schemas/Nivel' } }
        - { name: status, in: query, schema: { type: string, enum: [BORRADOR, PUBLICADO, ARCHIVADO] } }
        - { name: puesto, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Modulo' }
                        - { type: object, properties: { uso: { type: object, properties: { personas: { type: integer }, completadas: { type: integer } } } } }
                  meta: { type: object, properties: { total: { type: integer } } }
        '403': { description: PH-PERM-001 · PH-PLAN-001 }
    post:
      summary: Crear un módulo propio en borrador (GERENTE, RRHH · RF-046, sin IA)
      security: [{ sesion: [], csrf: [] }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/ModuloEntrada' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/ModuloDetalle' } } } }
        '422': { description: PH-VAL-001 }
  /v1/training/modules/{id}:
    get:
      summary: Detalle de un módulo con su cuestionario y la solución (GERENTE, RRHH)
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ModuloDetalle' } } } }
        '404': { description: PH-TENANT-001 (módulo propio de otra empresa) }
    patch:
      summary: Editar un módulo propio (GERENTE, RRHH)
      description: Campos de ModuloEntrada, todos opcionales, y `estado` (BORRADOR o ARCHIVADO). Si estaba publicado y cambia el contenido, sube la versión.
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ModuloDetalle' } } } }
        '403': { description: PH-PERM-001 (el catálogo global no se edita) }
        '422': { description: PH-VAL-001 }
  /v1/training/modules/{id}/publish:
    post:
      summary: Publicar un módulo propio en el catálogo de la empresa (GERENTE, RRHH)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Modulo' } } } }
        '403': { description: PH-PERM-001 }
        '422': { description: PH-VAL-001 (sin bloques o con menos de dos preguntas) }
  /v1/training/assignments:
    get:
      summary: Seguimiento de la formación (GERENTE, RRHH)
      description: Solo personas de alta. Orden por urgencia (vencidas, en curso, pendientes, completadas).
      security: [{ sesion: [] }]
      parameters:
        - { name: modulo_id, in: query, schema: { type: integer } }
        - { name: equipo_id, in: query, schema: { type: integer } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: estado, in: query, schema: { type: string, enum: [PENDIENTE, EN_CURSO, COMPLETADA, VENCIDA] } }
        - { name: origen, in: query, schema: { type: string, enum: [GESTION, AUTOINSCRIPCION, ASESOR_IA] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Asignacion' } }
                  meta: { $ref: '#/components/schemas/Paginacion' }
    post:
      summary: Asignar un módulo a personas o a un equipo (GERENTE, RRHH · RF-042)
      description: Si la persona ya lo tenía por autoinscripción pasa a ser asignación de la empresa con la nueva fecha límite. Las completadas no se tocan.
      security: [{ sesion: [], csrf: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [modulo_id]
              properties:
                modulo_id: { type: integer }
                usuario_ids: { type: array, maxItems: 250, items: { type: integer } }
                equipo_id: { type: integer }
                fecha_limite: { type: string, format: date, description: No anterior a hoy }
      responses:
        '201':
          description: Asignado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      creadas: { type: integer }
                      actualizadas: { type: integer }
                      ya_completadas: { type: integer }
                      personas: { type: integer }
                      modulo: { type: object, properties: { id: { type: integer }, titulo: { type: string } } }
        '200': { description: Sin asignaciones nuevas (misma forma que 201) }
        '404': { description: PH-TENANT-001 (persona, equipo o módulo de otra empresa) }
        '422': { description: PH-VAL-001 }
  /v1/training/assignments/{id}:
    delete:
      summary: Retirar una asignación de la empresa no completada (GERENTE, RRHH)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: Retirada }
        '404': { description: PH-TENANT-001 }
        '422': { description: PH-VAL-001 (autoinscripción o ya completada) }
  /v1/training/recommendations:
    get:
      summary: Recomendaciones por reglas con su motivo (GERENTE, RRHH · RF-043)
      description: |
        Siniestro en 90 días → seguridad vial; queja de cliente → atención al cliente; equipo con alerta de bienestar
        abierta (dato agregado) → gestión del estrés; menos de 30 días en la empresa → acogida.
        No usa datos individuales de bienestar. Omite los módulos en los que la persona ya está.
      security: [{ sesion: [] }]
      parameters: [{ name: employee_id, in: query, schema: { type: integer } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Recomendacion' } }
                  meta: { type: object, properties: { total: { type: integer }, por_regla: { type: object, additionalProperties: { type: integer } } } }
  /v1/training/summary:
    get:
      summary: Indicadores de formación de la empresa (GERENTE, RRHH)
      security: [{ sesion: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      asignadas: { type: integer }
                      voluntarias: { type: integer }
                      pendientes: { type: integer }
                      en_curso: { type: integer }
                      completadas: { type: integer }
                      vencidas: { type: integer }
                      tasa_finalizacion: { type: [integer, 'null'] }
                      nota_media: { type: [integer, 'null'] }
                      personas: { type: integer }
                      por_modulo: { type: array, items: { type: object } }
                      por_equipo: { type: array, items: { type: object } }
                      recomendaciones: { type: integer }
  /v1/me/training:
    get:
      summary: Mi formación (EMPLEADO)
      security: [{ sesion: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Asignacion' } }
                  meta:
                    type: object
                    properties:
                      hoy: { type: string, format: date }
                      pendientes: { type: integer }
                      en_curso: { type: integer }
                      completadas: { type: integer }
                      vencidas: { type: integer }
                      minutos_completados: { type: integer }
  /v1/me/training/catalog:
    get:
      summary: Catálogo publicado con mi situación en cada módulo (EMPLEADO)
      security: [{ sesion: [] }]
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Categoria' } }
        - { name: level, in: query, schema: { $ref: '#/components/schemas/Nivel' } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: 'Cada módulo añade asignacion ({ id, estado, origen } o null) y para_mi_puesto'
  /v1/me/training/enroll:
    post:
      summary: Autoinscripción en un módulo publicado (EMPLEADO · RF-047)
      security: [{ sesion: [], csrf: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [modulo_id], properties: { modulo_id: { type: integer }, solicitud_id: { type: integer, description: 'Si viene de una recomendación del asesor: origen ASESOR_IA' } } } } } }
      responses:
        '201': { description: Inscrito, content: { application/json: { schema: { $ref: '#/components/schemas/Asignacion' } } } }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-TRN-002 }
  /v1/me/training/{id}:
    get:
      summary: Cursar un módulo (EMPLEADO)
      description: Asignación con el módulo completo. Las preguntas no incluyen la solución.
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer }, description: Id de la asignación }]
      responses:
        '200': { description: ok }
        '409': { description: PH-TRN-001 (no es suya) }
  /v1/me/training/{id}/progress:
    post:
      summary: Guardar el avance (EMPLEADO · RF-045)
      description: Idempotente y monótono (nunca retrocede). El 100 % solo se alcanza aprobando; el avance se limita a 90.
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { type: object, required: [bloque, progreso_pct], properties: { bloque: { type: integer, minimum: 0, maximum: 20 }, progreso_pct: { type: integer, minimum: 0, maximum: 100 } } } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Asignacion' } } } }
        '409': { description: PH-TRN-001 }
  /v1/me/training/{id}/submit:
    post:
      summary: Enviar el cuestionario (EMPLEADO · RF-044)
      description: |
        Aprobado con ≥ 70 %, intentos ilimitados, se guarda la mejor nota. Con el mismo `envio_id`
        (reenvío desde la cola sin conexión) no cuenta un intento nuevo y `repetido` es true.
        La solución de cada pregunta solo se devuelve si se aprueba.
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [respuestas]
              properties:
                respuestas: { type: array, items: { type: integer, minimum: 0 }, description: Índice elegido por pregunta, en orden }
                envio_id: { type: string, minLength: 8, maxLength: 36, description: 'Identificador del envío (UUID) para la idempotencia' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      resultado:
                        type: object
                        properties:
                          nota: { type: integer }
                          aprobado: { type: boolean }
                          aciertos: { type: integer }
                          total: { type: integer }
                          detalle: { type: array, items: { type: object, properties: { pregunta_id: { type: integer }, correcta: { type: boolean }, elegida: { type: integer }, solucion: { type: integer } } } }
                      asignacion: { $ref: '#/components/schemas/Asignacion' }
                      repetido: { type: boolean }
                  meta: { type: object, properties: { aprobado_con: { type: integer, example: 70 } } }
        '409': { description: PH-TRN-001 }
        '422': { description: PH-VAL-001 }
  /v1/me/training/preferences:
    get:
      summary: Mis preferencias para el asesor y las opciones disponibles (EMPLEADO)
      security: [{ sesion: [] }]
      responses:
        '200': { description: 'data = Preferencias o null; meta.opciones = objetivos, temas, formatos y minutos' }
    put:
      summary: Guardar mis preferencias (EMPLEADO · §12.2, IA-010)
      security: [{ sesion: [], csrf: [] }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Preferencias' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Preferencias' } } } }
        '422': { description: 'PH-VAL-001 · PH-AI-004 (el comentario contiene datos personales o de salud)' }
    delete:
      summary: Borrar mis preferencias (EMPLEADO · LEG-014)
      security: [{ sesion: [], csrf: [] }]
      responses:
        '204': { description: Borradas }
  /v1/me/training/advisor:
    post:
      summary: Recomendaciones del asesor de formación (EMPLEADO · §12, IA-001 a IA-019)
      description: |
        Devuelve entre 3 y 5 módulos del catálogo con su motivo y un plan semanal. Nunca devuelve un error del proveedor:
        si falla, se agota la cuota o no hay red, responde con la caché o con el respaldo por reglas y lo indica en
        `meta.aviso` (PH-AI-001, PH-AI-002, PH-AI-003). Al proveedor solo se envían el puesto genérico, el tramo de
        antigüedad, el turno, las preferencias y el catálogo resumido (§12.3).
      security: [{ sesion: [], csrf: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RespuestaAsesor' }
                  meta: { type: object, properties: { aviso: { type: object, properties: { code: { type: string }, message: { type: string } } } } }
        '422': { description: PH-VAL-001 (sin preferencias) }
        '429': { description: PH-RATE-001 }
  /v1/me/training/advisor/feedback:
    post:
      summary: Valorar si la recomendación ha sido útil (EMPLEADO)
      security: [{ sesion: [], csrf: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [solicitud_id, util], properties: { solicitud_id: { type: integer }, util: { type: boolean } } } } } }
      responses:
        '200': { description: ok }
        '404': { description: PH-TENANT-001 }
  /v1/training/demand:
    get:
      summary: Demanda formativa agregada (GERENTE, RRHH · IA-021)
      description: Recuentos de objetivos, temas y minutos de las preferencias de la plantilla. Con menos de 5 personas no se muestra (LEG-002, `meta.aviso.code` = PH-WB-001).
      security: [{ sesion: [] }]
      responses:
        '200': { description: 'data = { disponible, personas, objetivos[], temas[], minutos[], uso: { consultas_30d, utilidad } }' }
  /v1/admin/ai-usage:
    get:
      summary: Uso del asesor de IA (ADMIN)
      description: Consultas por origen, avisos, valoraciones, tokens, latencia y consultas por empresa. Sin contenido de ninguna consulta.
      security: [{ sesion: [] }]
      parameters: [{ name: days, in: query, schema: { type: integer, default: 30, maximum: 90 } }]
      responses:
        '200': { description: ok }
  /v1/dashboard/overview:
    get:
      summary: Indicadores de la empresa (GERENTE, RRHH · RF-030)
      description: Ambos planes. `riesgo` y `alertas_riesgo_abiertas` son null en el plan Entrada. El índice de bienestar solo aparece con 5 o más respuestas (LEG-002).
      security: [{ sesion: [] }]
      responses:
        '200':
          description: 'data = { plantilla_activa, rotacion_12m, rotacion_voluntaria_12m, bajas_12m, antiguedad_media_meses, formacion_en_plazo, riesgo: { alto, medio, bajo, calculado, version_reglas, retrospectiva: { bajas_voluntarias, alto, medio, bajo, sin_puntuacion } } | null, bienestar: { disponible, indice?, nivel?, semana? } | null, alertas_abiertas, alertas_riesgo_abiertas }'
  /v1/dashboard/trends:
    get:
      summary: Tendencias mensuales (GERENTE, RRHH · plan Completo)
      security: [{ sesion: [] }]
      parameters: [{ name: months, in: query, schema: { type: integer, minimum: 3, maximum: 12, default: 6 } }]
      responses:
        '200': { description: 'data = [{ mes, altas, bajas, bajas_voluntarias, plantilla, rotacion, ausencias, reconocimientos, riesgo_medio, pct_alto }]' }
        '403': { description: PH-PLAN-001 }
  /v1/risk:
    get:
      summary: Riesgo de rotación por persona, de mayor a menor (GERENTE, RRHH · plan Completo · RF-031)
      description: Última puntuación de cada persona de alta. En el ranking solo van los 3 factores principales; la explicación completa está en la ficha. Si la empresa no tiene puntuaciones todavía, se calcula la del día.
      security: [{ sesion: [] }]
      parameters:
        - { name: team_id, in: query, schema: { type: integer } }
        - { name: level, in: query, schema: { $ref: '#/components/schemas/NivelRiesgo' } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Nombre, apellidos o código interno }
      responses:
        '200':
          description: 'meta = { total, niveles: { alto, medio, bajo }, calculado, version_reglas, supervision }'
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/PuntuacionRiesgo' } } } } } }
        '403': { description: PH-PLAN-001 (plan Entrada) o PH-PERM-001 (empleado) }
  /v1/employees/{id}/risk:
    get:
      summary: Ficha de riesgo explicada (GERENTE, RRHH · plan Completo · RF-034)
      description: Puntuación, factores en lenguaje llano con evidencia y fuentes, e histórico de 90 días. Cada consulta queda en el registro de auditoría (LEG-004).
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200':
          description: 'data = PuntuacionRiesgo + historico[{ fecha, puntuacion, nivel }]; meta = { supervision, metodologia, alerta: { id, severidad, creado_en } | null }'
          content: { application/json: { schema: { $ref: '#/components/schemas/PuntuacionRiesgo' } } }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 (empleado de baja) }
  /v1/risk/recalculate:
    post:
      summary: Recalcular el riesgo de la empresa (GERENTE, RRHH · plan Completo · RF-031)
      description: Sustituye la puntuación del día y crea las alertas de paso a nivel alto (RF-033). Una vez cada 10 minutos por empresa.
      security: [{ sesion: [], csrf: [] }]
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: 'data = { personas, alto, medio, bajo, alertas, fecha, version_reglas }' }
        '429': { description: PH-RATE-001 }
  /v1/risk/methodology:
    get:
      summary: Metodología del motor de riesgo (GERENTE, RRHH · plan Completo · RF-034, LEG-006)
      security: [{ sesion: [] }]
      responses:
        '200': { description: 'data = { version, niveles[], factores[{ codigo, nombre, condicion, puntos_max, evidencia, fuentes }], excluidos[], fuentes[{ id, referencia }], limitaciones[], supervision }' }
  /v1/risk/bias:
    get:
      summary: Revisión de sesgos por grupos (GERENTE, RRHH · plan Completo · LEG-015)
      description: Niveles por equipo, puesto, turno y tipo de contrato. `revisar` marca los grupos de 5 o más personas que se apartan más de 20 pp del total; `esperable` indica que el grupo es un factor del modelo.
      security: [{ sesion: [] }]
      responses:
        '200': { description: 'data = { personas, pct_alto_total, umbral_pp, version_reglas, dimensiones[{ dimension, grupos[{ grupo, personas, alto, medio, bajo, pct_alto, diferencia, revisar, muestra_pequena, esperable }] }] }' }
  /v1/baseline:
    get:
      summary: Línea base de impacto y comparación (GERENTE, RRHH · plan Completo · RF-037)
      security: [{ sesion: [] }]
      responses:
        '200':
          description: 'meta.sugerencia = { alta, periodo_inicio, periodo_fin }: los 12 meses anteriores al alta'
          content: { application/json: { schema: { $ref: '#/components/schemas/LineaBase' } } }
        '403': { description: PH-PLAN-001 }
    put:
      summary: Registrar la línea base (GERENTE, RRHH · plan Completo · RF-037)
      description: Sustituye la línea base anterior. El periodo debe cubrir entre 6 y 13 meses y no puede terminar en el futuro.
      security: [{ sesion: [], csrf: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [periodo_inicio, periodo_fin, plantilla_media, bajas_voluntarias, dias_absentismo]
              properties:
                periodo_inicio: { type: string, format: date }
                periodo_fin: { type: string, format: date }
                plantilla_media: { type: number, minimum: 1 }
                bajas_voluntarias: { type: integer, minimum: 0 }
                dias_absentismo: { type: integer, minimum: 0 }
                fuente: { type: [string, 'null'], maxLength: 150 }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/LineaBase' } } }, description: ok }
        '422': { description: PH-VAL-001 }
  /v1/public/visits:
    post:
      summary: Visita de una campaña comercial (público · DMO-030)
      description: 'Sin sesión ni CSRF. Cuenta visitas, no visitantes. No guarda IP, User-Agent completo ni identificadores; el dispositivo (MOVIL, ESCRITORIO, OTRO) se deriva del User-Agent en el servidor. Campañas de serie: `folleto_comercial` (QR /demo) e `instalar_app` (QR /app); más las de config.php (`campaigns`) y `prueba_interna` para las pruebas automáticas. Con `medium = instalacion` se registra una instalación de la app completada (evento appinstalled). Límite de 30 peticiones por minuto e IP.'
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [campaign, source, medium]
              additionalProperties: false
              properties:
                campaign: { type: string, example: folleto_comercial }
                source: { type: string, pattern: '^[a-z0-9_-]{1,40}$', example: qr }
                medium: { type: string, pattern: '^[a-z0-9_-]{1,40}$', example: folleto }
      responses:
        '204': { description: Visita registrada }
        '422': { description: PH-VAL-001 (campaña no admitida o campo no declarado) }
        '429': { description: PH-RATE-001 }
  /v1/public/demo-status:
    get:
      summary: ¿Está disponible la demostración? (público · DMO-037)
      security: []
      responses:
        '200': { description: 'data = { enabled }. Sin credenciales.' }
  /v1/admin/campaign-metrics:
    get:
      summary: Métricas del QR del folleto (ADMIN · DMO-035)
      description: Fechas en hora de España, ambas incluidas; sin `from`, desde la primera visita. Los inicios de sesión demo salen del registro de auditoría (`LOGIN_DEMO`).
      security: [{ sesion: [] }]
      parameters:
        - { name: campaign, in: query, schema: { type: string, default: folleto_comercial } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: 'data = { campania, visitas, por_dispositivo: { MOVIL, ESCRITORIO, OTRO }, por_dia[{ fecha, visitas }], por_hora[{ hora, visitas }], logins_demo: { total, por_perfil: { GERENTE, RRHH, EMPLEADO } }, instalaciones: { total, por_dispositivo } (filas con medium = instalacion, que no cuentan como visitas), primera_visita, ultima_visita }; meta = { desde, hasta, zona, campanias, demo: { habilitada } }' }
        '403': { description: PH-PERM-001 }
  /v1/alerts:
    get:
      summary: Alertas de la empresa (GERENTE, RRHH · §8.4)
      description: Bienestar de equipo en ambos planes (RF-054); riesgo de rotación solo en el plan Completo (RF-033).
      security: [{ sesion: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, managed, dismissed, all], default: open } }
        - { name: tipo, in: query, schema: { type: string, enum: [BIENESTAR_EQUIPO, RIESGO_ROTACION, FORMACION_VENCIDA] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Alerta' } }
                  meta:
                    allOf:
                      - { $ref: '#/components/schemas/Paginacion' }
                      - type: object
                        properties:
                          abiertas: { type: integer }
  /v1/alerts/{id}:
    patch:
      summary: Gestionar una alerta (GERENTE, RRHH · LEG-005)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [GESTIONADA, DESCARTADA, ABIERTA] }
                nota_gestion: { type: string, maxLength: 500 }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Alerta' } } } }
        '404': { description: PH-TENANT-001 }
        '422': { description: PH-VAL-001 }
  /v1/admin/tenants/{id}/export:
    get:
      summary: Exportar todos los datos de una empresa en ZIP (ADMIN · RF-110)
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: 'application/zip (Content-Disposition attachment). LEEME.txt, empresa.json, equipos.csv, empleados.csv, cuentas_gestion.csv, incidencias.csv, formacion.csv, modulos_propios.json, bienestar_semanal_por_equipo.csv (solo grupos de 5 o más), alertas.csv, riesgo_rotacion_ultimo.csv. CSV en UTF-8 con BOM y separador «;». Nunca incluye las notas del check-in.' }
        '404': { description: PH-TENANT-001 }
  /v1/company/export:
    get:
      summary: Exportar los datos de mi empresa en ZIP (GERENTE · RF-110)
      description: Mismo contenido que la exportación de la plataforma. Disponible también con la empresa de baja o en solo lectura. No disponible para cuentas demo (PH-DEMO-001).
      security: [{ sesion: [] }]
      responses:
        '200': { description: application/zip }
        '403': { description: PH-PERM-001 · PH-DEMO-001 }
  /v1/me/data-export:
    get:
      summary: Descargar mis datos (cualquier perfil · RGPD art. 15 y 20)
      description: JSON descargable con la cuenta (incluida la versión de la privacidad aceptada), la ficha, los check-ins con la nota descifrada, las incidencias, la formación, las preferencias, las consultas al asesor y las puntuaciones de riesgo. No disponible para cuentas demo.
      security: [{ sesion: [] }]
      responses:
        '200': { description: application/json (attachment) }
        '403': { description: PH-DEMO-001 }
  /v1/employees/{id}/erase:
    post:
      summary: Suprimir los datos de una persona dada de baja (GERENTE · RGPD art. 17)
      description: Borra check-ins, preferencias, consultas al asesor, puntuaciones, incidencias, asignaciones, invitaciones y alertas; anonimiza nombre y correo. Conserva fechas, motivo, puesto y equipo para los indicadores de rotación. Irreversible.
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [confirmacion]
              additionalProperties: false
              properties:
                confirmacion: { type: string, enum: [SUPRIMIR] }
      responses:
        '200': { description: ok }
        '403': { description: PH-PERM-001 · PH-DEMO-001 }
        '404': { description: PH-TENANT-001 }
        '409': { description: 'PH-VAL-001: la persona sigue de alta (antes, darla de baja)' }
  /v1/public/status:
    get:
      summary: Estado público de la plataforma (RNF-063)
      security: []
      responses:
        '200': { description: 'data = { mantenimiento, mensaje, programado: { inicio, fin, mensaje } | null }. El programado aparece desde 48 h antes.' }
  /v1/admin/maintenance:
    get:
      summary: Estado del mantenimiento (ADMIN · RNF-063)
      security: [{ sesion: [] }]
      responses: { '200': { description: 'data = { activo, mensaje, programado: { inicio, fin } | null, aviso_horas }' } }
    put:
      summary: Activar o programar el mantenimiento (ADMIN · RNF-063)
      description: Con el mantenimiento activo, la API responde PH-SYS-003 (503) salvo /v1/health, /v1/public/*, /v1/auth/* y /v1/admin/*. Fechas en hora de España (AAAA-MM-DDTHH:MM); el fin debe ser posterior al inicio.
      security: [{ sesion: [], csrf: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              additionalProperties: false
              properties:
                activo: { type: boolean }
                mensaje: { type: [string, 'null'], maxLength: 200 }
                programado_inicio: { type: [string, 'null'], example: '2026-10-25T22:00' }
                programado_fin: { type: [string, 'null'], example: '2026-10-25T22:30' }
      responses:
        '200': { description: ok }
        '422': { description: PH-VAL-001 }
  /v1/admin/errors:
    get:
      summary: Resumen de errores 5xx (ADMIN · RNF-062)
      security: [{ sesion: [] }]
      parameters: [{ name: hours, in: query, schema: { type: integer, default: 24, minimum: 1, maximum: 168 } }]
      responses: { '200': { description: 'data = { horas, total, grupos[{ code, ruta, veces, ultima, correlation_id }] }. Sin datos personales.' } }
  /v1/public/params:
    get:
      summary: Parámetros públicos (fase 9a)
      description: Titular (pendiente mientras `titular.constituida` es false), precios por empleado y mes sin IVA, IVA, descuento anual, días de prueba, borrado tras la baja, comisión y exención de Skills, versión de los textos legales; y `ejemplos` de importe por plan y ciclo para 1 empleado.
      security: []
      responses:
        '200': { description: 'data = { "titular.constituida", "titular.razon_social", …, "precios.entrada_mes", "precios.completo_mes", "precios.iva_pct", "precios.descuento_anual_pct", "suscripcion.dias_prueba", "legal.version", ejemplos: { ENTRADA|COMPLETO: { MENSUAL|ANUAL: Importe } } }; Importe = { plan, ciclo, empleados, precio_empleado_mes, meses, importe_bruto, descuento_pct, descuento, base, iva_pct, iva, total, moneda }' }
  /v1/admin/params:
    get:
      summary: Parámetros de la plataforma con su definición (ADMIN)
      security: [{ sesion: [] }]
      responses: { '200': { description: 'data = [{ clave, tipo (bool|int|money|email|string), grupo, etiqueta, min, max, valor }]' } }
    put:
      summary: Cambiar parámetros (ADMIN)
      description: 'Objeto parcial { clave: valor }. Se valida cada clave (desconocida, tipo y límites) y no se guarda nada si alguna falla. Queda en la auditoría (parametros.actualizados).'
      security: [{ sesion: [], csrf: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, example: { precios.descuento_anual_pct: 10, titular.constituida: false } }
      responses:
        '200': { description: Lista actualizada (como GET) }
        '422': { description: PH-VAL-001 con el error por clave en details }
  /v1/billing/subscription:
    get:
      summary: Suscripción de mi empresa (GERENTE · fase 9b)
      description: Disponible también con la suscripción vencida.
      security: [{ sesion: [] }]
      responses:
        '200': { description: 'data = { plan, ciclo_cobro, vigencia: Vigencia, empleados_activos, empleados_facturados, importes: { MENSUAL: Importe, ANUAL: Importe } (por los empleados activos, mínimo 1), precios: { ENTRADA, COMPLETO }, pago_online: { disponible, modo: PRUEBA, cliente, suscripcion }, terminos: { version_vigente, version_aceptada, aceptados_en } }. Vigencia = { estado: PRUEBA|VIGENTE|GRACIA|VENCIDA, periodo_fin, gracia_hasta, dias_restantes, solo_lectura, cancelar_al_final, pago_online }. También en GET /v1/auth/me (vigencia).' }
        '403': { description: PH-PERM-001 }
  /v1/billing/invoices:
    get:
      summary: Facturas y pagos de mi empresa (GERENTE)
      security: [{ sesion: [] }]
      responses:
        '200': { description: 'data[] = { id, origen: STRIPE|MANUAL, numero, estado: PAGADO|FALLIDO|PENDIENTE|ANULADO, plan, ciclo_cobro, empleados, base, iva, total, moneda, periodo_inicio, periodo_fin, url_factura, url_pdf, nota, creado_en }' }
  /v1/billing/checkout:
    post:
      summary: Contratar o renovar con Stripe Checkout (GERENTE · fase 9c, modo prueba)
      description: Registra la aceptación de los términos (versión legal vigente) y crea una sesión de Checkout de suscripción por empleado activo, precio sin IVA + tax rate exclusivo del IVA parametrizado, mensual o anual con el descuento anual. Si la empresa está en prueba con más de 48 h por delante, el primer cobro se hace al terminar la prueba. No disponible en la demo.
      security: [{ sesion: [], csrf: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [plan, ciclo, acepta_terminos]
              additionalProperties: false
              properties:
                plan: { type: string, enum: [ENTRADA, COMPLETO] }
                ciclo: { type: string, enum: [MENSUAL, ANUAL] }
                acepta_terminos: { type: boolean, const: true }
      responses:
        '201': { description: 'data = { url (redirigir), id, importe: Importe, cobro_al_terminar_prueba }' }
        '403': { description: PH-DEMO-001 · PH-PERM-001 }
        '409': { description: PH-PAY-003 }
        '422': { description: PH-VAL-001 }
        '502': { description: PH-PAY-002 }
        '503': { description: PH-PAY-001 }
  /v1/billing/portal:
    post:
      summary: Portal del cliente de Stripe (GERENTE)
      description: Tarjeta, facturas y cancelación al final del periodo. El portal se configura en el panel de Stripe (modo prueba).
      security: [{ sesion: [], csrf: [] }]
      responses:
        '201': { description: 'data = { url }' }
        '409': { description: PH-PAY-004 }
  /v1/stripe/webhook:
    post:
      summary: Webhook de Stripe (fase 9c)
      description: 'Fase 9d: también checkout.session.completed/expired de compras de Skills (metadata.compra_skills_id) y account.updated de cuentas conectadas. Sin sesión ni CSRF; exige la cabecera Stripe-Signature (HMAC-SHA256 con stripe.webhook_secret, tolerancia 5 min). Idempotente por id de evento (evento_stripe). Eventos: checkout.session.completed (enlaza cliente y suscripción, aplica plan y ciclo), invoice.paid (pago PAGADO, vigencia VIGENTE hasta el fin del periodo, PILOTO → ACTIVO), invoice.payment_failed (pago FALLIDO), customer.subscription.created/updated (cantidad, cancelación, prueba), customer.subscription.deleted (deja de renovarse; la vigencia sigue hasta periodo_fin). Eventos livemode se ignoran. Si el proceso falla responde 5xx y Stripe reintenta.'
      security: []
      responses:
        '200': { description: 'data = { recibido: true, resultado: ok|duplicado|ignorado|sin_empresa|ignorado_livemode }' }
        '400': { description: PH-PAY-005 }
  /v1/admin/payments:
    get:
      summary: Pagos de todas las empresas o de una (ADMIN)
      security: [{ sesion: [] }]
      parameters: [{ name: tenant, in: query, schema: { type: integer } }]
      responses: { '200': { description: 'data[] como /v1/billing/invoices con empresa; meta = { total, cobrado, stripe: { habilitado, modo } }' } }
  /v1/admin/tenants/{id}/validity:
    put:
      summary: Renovar, ampliar o quitar el vencimiento (ADMIN · fase 9b)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [AMPLIAR, FIJAR, SIN_VENCIMIENTO] }
                dias: { type: integer, minimum: 1, maximum: 400, default: 30, description: 'AMPLIAR: desde periodo_fin si no ha pasado, si no desde hoy' }
                periodo_fin: { type: string, format: date, description: 'FIJAR: último día pagado o de prueba' }
                vigencia: { type: string, enum: [PRUEBA, VIGENTE] }
                pago_manual:
                  type: object
                  description: Registra un pago fuera de Stripe con el IVA vigente
                  properties:
                    base: { type: number, minimum: 0 }
                    nota: { type: string, maxLength: 200 }
      responses:
        '200': { description: 'data = Vigencia' }
        '404': { description: PH-TENANT-001 }
        '422': { description: PH-VAL-001 }
  /v1/skills/catalog:
    get:
      summary: Catálogo de Pyme Hub Skills (GERENTE, RRHH, EMPLEADO · fase 9d)
      description: Cursos aprobados por la plataforma y publicados por su formador. La gerencia ve el precio de licencia sin IVA; la persona empleada, su precio con IVA incluido.
      security: [{ sesion: [] }]
      responses:
        '200': { description: 'data[] = { id, titulo, resumen, categoria, nivel, duracion_min, puestos_destino, objetivos, bloques, formador: { id, nombre, cobra_online }, precio_empresa, precio_persona, importes: { EMPRESA: ImporteSkills, PERSONA: ImporteSkills }, licencia_empresa, comprado_por_mi }; meta = { total, comision_pct, iva_pct }. ImporteSkills = { tipo, base, iva_pct, iva, total, iva_incluido, comision_pct, comision, importe_formador, moneda }' }
  /v1/skills/purchases:
    get:
      summary: Compras de Skills (GERENTE las de la empresa; EMPLEADO las suyas)
      security: [{ sesion: [] }]
      responses: { '200': { description: 'data[] = { id, modulo_id, titulo, formador, tipo, base, iva, total, estado, creado_en, pagado_en, ficticia }' } }
    post:
      summary: Comprar un curso (GERENTE licencia para la empresa; EMPLEADO para sí mismo)
      description: 'Crea la compra pendiente y una sesión de Stripe Checkout de pago único con cargo con destino a la cuenta conectada del formador: application_fee_amount = comisión + IVA; el formador recibe la base menos la comisión. Empresa: precio sin IVA + tax rate exclusivo. Persona: precio con IVA incluido (tax rate inclusivo) y renuncia expresa al desistimiento (contenido digital). Al pagar (webhook checkout.session.completed) la licencia hace el curso visible para toda la empresa; la compra personal inscribe a la persona. No disponible en la demo.'
      security: [{ sesion: [], csrf: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [modulo_id, acepta_condiciones]
              additionalProperties: false
              properties:
                modulo_id: { type: integer }
                acepta_condiciones: { type: boolean, const: true }
                renuncia_desistimiento: { type: boolean, description: 'Obligatorio (true) para EMPLEADO' }
      responses:
        '201': { description: 'data = { url, compra_id, importe: ImporteSkills }' }
        '403': { description: PH-PERM-001 · PH-DEMO-001 }
        '409': { description: PH-SKL-002 · PH-SKL-003 }
        '422': { description: PH-VAL-001 }
        '503': { description: PH-PAY-001 }
  /v1/skills/my-courses:
    get:
      summary: Cursos del formador (FORMADOR)
      security: [{ sesion: [] }]
      responses: { '200': { description: 'data[] = { id, titulo, resumen, categoria, nivel, duracion_min, modulo_estado, estado: SIN_PRECIO|BORRADOR|PENDIENTE|APROBADO|RECHAZADO|RETIRADO, motivo, precio_empresa, precio_persona, ventas, ingresos, actualizado_en }' } }
    post:
      summary: Crear un curso (FORMADOR) con el mismo cuerpo que POST /v1/training/modules
      security: [{ sesion: [], csrf: [] }]
      responses: { '201': { description: Módulo en borrador }, '422': { description: PH-VAL-001 } }
  /v1/skills/my-courses/{id}:
    get:
      summary: Curso del formador con cuestionario y ficha comercial (FORMADOR)
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 'Módulo + preguntas + ficha: { precio_empresa, precio_persona, estado, motivo, enviado_en, revisado_en, importes }' }, '404': { description: PH-TENANT-001 } }
    patch:
      summary: Editar el curso (FORMADOR); si estaba aprobado, vuelve a revisión
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok } }
  /v1/skills/my-courses/{id}/publish:
    post:
      summary: Publicar el curso (FORMADOR; al menos un bloque y dos preguntas)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok }, '422': { description: PH-VAL-001 } }
  /v1/skills/my-courses/{id}/listing:
    put:
      summary: Precios del curso (FORMADOR)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [precio_empresa, precio_persona]
              properties:
                precio_empresa: { type: number, minimum: 1, maximum: 5000, description: Licencia para una empresa, sin IVA }
                precio_persona: { type: number, minimum: 1, maximum: 5000, description: Particular, IVA incluido }
      responses: { '200': { description: 'Como GET my-courses/{id}' } }
  /v1/skills/my-courses/{id}/submit:
    post:
      summary: Enviar el curso a revisión (FORMADOR)
      description: Exige el módulo publicado y los dos precios.
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: 'ficha.estado = PENDIENTE' }, '422': { description: 'PH-VAL-001 (details: modulo, precios)' } }
  /v1/skills/sales:
    get:
      summary: Ventas del formador (FORMADOR), sin datos personales de quien compra
      security: [{ sesion: [] }]
      responses: { '200': { description: 'data[] = { id, titulo, tipo, cliente (empresa o «Particular»), base, iva, total, comision_pct, comision, importe_formador, estado, pagado_en, ficticia }; meta.totales = { ventas, total, comision, importe_formador }' } }
  /v1/skills/connect:
    get:
      summary: Estado de la cuenta de cobro (Stripe Connect Express, modo prueba) del formador
      security: [{ sesion: [] }]
      responses: { '200': { description: 'data = { disponible, cuenta, lista, modo, pendiente[] }' } }
    post:
      summary: Enlace de alta en Stripe Connect (FORMADOR; no disponible en la demo)
      security: [{ sesion: [], csrf: [] }]
      responses: { '201': { description: 'data = { url }' }, '503': { description: PH-PAY-001 } }
  /v1/admin/trainers:
    get:
      summary: Formadores con su cobro, cursos, ventas, comisión y lo liquidado (ADMIN)
      security: [{ sesion: [] }]
      responses: { '200': { description: ok } }
    post:
      summary: Alta de formador e invitación de su cuenta (ADMIN)
      security: [{ sesion: [], csrf: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [nombre, nif, formador]
              properties:
                nombre: { type: string }
                nombre_comercial: { type: string }
                nif: { type: string }
                email_contacto: { type: string, format: email }
                formador: { type: object, required: [nombre, email], properties: { nombre: { type: string }, apellidos: { type: string }, email: { type: string, format: email } } }
      responses: { '201': { description: 'data = { id, invitacion: { enlace, caduca_en } }' }, '409': { description: NIF o email duplicado } }
  /v1/admin/skills/courses:
    get:
      summary: Cursos enviados a la plataforma (ADMIN)
      security: [{ sesion: [] }]
      parameters: [{ name: estado, in: query, schema: { type: string, enum: [BORRADOR, PENDIENTE, APROBADO, RECHAZADO, RETIRADO] } }]
      responses: { '200': { description: 'data[]; meta = { total, pendientes }' } }
  /v1/admin/skills/courses/{id}:
    get:
      summary: Contenido completo del curso para revisarlo (ADMIN)
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok } }
  /v1/admin/skills/courses/{id}/review:
    post:
      summary: Aprobar, pedir cambios o retirar un curso (ADMIN)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APROBAR, RECHAZAR, RETIRAR] }
                motivo: { type: string, maxLength: 300, description: Obligatorio para rechazar }
      responses: { '200': { description: ok }, '422': { description: PH-VAL-001 } }
  /v1/admin/skills/sales:
    get:
      summary: Ventas del marketplace, comisiones y liquidaciones a formadores (ADMIN)
      security: [{ sesion: [] }]
      responses: { '200': { description: 'data[] como /v1/skills/sales con formador; meta = { total, totales, stripe }' } }
