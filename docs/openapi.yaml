openapi: 3.1.0
info:
  title: Pyme Hub API
  version: 0.10.0
  description: |
    Contrato entre pymehub_api y pymehub_web (DEC-13).
    Autenticación por cookie de sesión HttpOnly. Toda petición que modifica datos
    exige la cabecera X-CSRF-Token con el valor devuelto por /v1/auth/me o /v1/auth/login.
    Errores: { "error": { "code": "PH-…", "message", "details", "correlation_id" } }.
    Demo comercial (docs/requerimientos/REQ_QR_DEMO_COMERCIAL.md): PH-DEMO-001 (403) acción no disponible
    para usuarios demo; PH-DEMO-002 (403) demostración desactivada (config demo.habilitada).
    Vigencia (fase 9b): PH-PLAN-002 (403) suscripción vencida tras la gracia, solo lectura (salvo /v1/billing/* y logout).
    Pagos (fase 9c, Stripe solo en modo prueba): PH-PAY-001 (503) pago online no disponible; PH-PAY-002 (502) error de la
    pasarela; PH-PAY-003 (409) ya hay pago online; PH-PAY-004 (409) sin cliente de Stripe; PH-PAY-005 (400) firma de webhook no válida.
    Pyme Hub Skills (fase 9d): PH-SKL-002 (409) el formador aún no cobra online; PH-SKL-003 (409) curso ya disponible
    (licencia de la empresa o compra propia). Perfil FORMADOR (interlocutor tipo FORMADOR).
    Listados paginados: ?page=&per_page= (máx. 100); meta = { total, page, per_page }.
servers:
  - url: https://api.pymehub.hermantorres.com
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: PHSESSID
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: PH-AUTH-001 }
            message: { type: string }
            details: { type: object }
            correlation_id: { type: string }
    Me:
      type: object
      properties:
        usuario:
          type: object
          properties:
            id: { type: integer }
            nombre: { type: string }
            apellidos: { type: string }
            email: { type: string }
            perfil: { type: string, enum: [ADMIN, GERENTE, RRHH, EMPLEADO] }
        interlocutor:
          type: object
          properties:
            id: { type: integer }
            tipo: { type: string, enum: [PLATAFORMA, EMPRESA, FORMADOR] }
            nombre: { type: string }
            estado: { type: string }
        plan: { type: [string, "null"], enum: [ENTRADA, COMPLETO, null] }
        features: { type: array, items: { type: string } }
        demo: { type: boolean, description: 'Cuenta de la demostración comercial (es_demo). Sus restricciones devuelven PH-DEMO-001; con la demo desactivada, PH-DEMO-002' }
        csrf_token: { type: string }
        sesion:
          type: object
          properties:
            inactividad_max_seg: { type: integer }
    Invitacion:
      type: object
      properties:
        enlace: { type: string }
        expira_en: { type: string, format: date-time }
    EmpresaAlta:
      type: object
      required: [nombre, nif, plan, ciclo_cobro, gerente]
      properties:
        nombre: { type: string }
        nombre_comercial: { type: string }
        nif: { type: string }
        sector: { type: string }
        email_contacto: { type: string }
        telefono_contacto: { type: string }
        plan: { type: string, enum: [ENTRADA, COMPLETO] }
        ciclo_cobro: { type: string, enum: [MENSUAL, ANUAL] }
        limite_empleados: { type: integer, maximum: 250 }
        fecha_contrato_encargado: { type: string, format: date }
        estado: { type: string, enum: [PILOTO, ACTIVO] }
        sin_prueba: { type: boolean, default: false, description: "true = VIGENTE sin vencimiento (acuerdo sin prueba gratuita)" }
        gerente:
          type: object
          required: [nombre, email]
          properties:
            nombre: { type: string }
            apellidos: { type: string }
            email: { type: string }
    Paginacion:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
    Equipo:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        zona: { type: [string, "null"] }
        responsable:
          type: [object, "null"]
          properties:
            id: { type: integer }
            nombre: { type: string }
            apellidos: { type: string }
        empleados: { type: integer, description: Empleados de alta en el equipo }
        creado_en: { type: string }
    EquipoEntrada:
      type: object
      properties:
        nombre: { type: string, minLength: 2, maxLength: 80, description: Obligatorio al crear; único entre los equipos vigentes }
        zona: { type: [string, "null"], maxLength: 80 }
        responsable_usuario_id: { type: [integer, "null"], description: Usuario de la misma empresa }
    Puesto: { type: string, enum: [CONDUCTOR, REPARTIDOR, MOZO_ALMACEN, COORDINADOR, ADMINISTRATIVO, OTRO] }
    TipoContrato: { type: string, enum: [INDEFINIDO, TEMPORAL, ETT] }
    Turno: { type: string, enum: [MANANA, TARDE, NOCHE, ROTATIVO] }
    Empleado:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        apellidos: { type: string }
        email: { type: [string, "null"] }
        estado_acceso: { type: string, enum: [SIN_ACCESO, INVITADO, ACTIVO, BLOQUEADO, BAJA] }
        codigo_interno: { type: [string, "null"] }
        puesto: { $ref: '#/components/schemas/Puesto' }
        tipo_contrato: { $ref: '#/components/schemas/TipoContrato' }
        turno: { $ref: '#/components/schemas/Turno' }
        fecha_alta: { type: string, format: date }
        fecha_baja: { type: [string, "null"], format: date }
        motivo_baja: { type: [string, "null"], enum: [VOLUNTARIA, NO_VOLUNTARIA, FIN_CONTRATO, null] }
        equipo:
          type: [object, "null"]
          properties:
            id: { type: integer }
            nombre: { type: string }
        ultimo_acceso_en: { type: [string, "null"] }
        creado_en: { type: string }
    EmpleadoEntrada:
      type: object
      description: |
        En el alta son obligatorios nombre, puesto, tipo_contrato, turno y fecha_alta.
        En PATCH todos son opcionales; los obligatorios no pueden quedar vacíos.
        El email solo se cambia mientras la cuenta está en SIN_ACCESO o INVITADO.
      properties:
        nombre: { type: string, minLength: 2, maxLength: 80 }
        apellidos: { type: [string, "null"], maxLength: 120 }
        email: { type: [string, "null"], format: email, description: Opcional hasta invitarle; único en la plataforma }
        codigo_interno: { type: [string, "null"], maxLength: 30, description: Único en la empresa }
        puesto: { $ref: '#/components/schemas/Puesto' }
        tipo_contrato: { $ref: '#/components/schemas/TipoContrato' }
        turno: { $ref: '#/components/schemas/Turno' }
        fecha_alta: { type: string, format: date }
        equipo_id: { type: [integer, "null"] }
    TipoIncidencia:
      type: string
      description: LEG-012 · solo ausencias injustificadas; nunca bajas médicas ni su causa
      enum: [AUSENCIA_INJUSTIFICADA, RETRASO, SINIESTRO, QUEJA_CLIENTE, RECONOCIMIENTO]
    Incidencia:
      type: object
      properties:
        id: { type: integer }
        empleado_id: { type: integer }
        tipo: { $ref: '#/components/schemas/TipoIncidencia' }
        fecha: { type: string, format: date }
        nota: { type: [string, "null"] }
        registrada_por:
          type: [object, "null"]
          properties:
            id: { type: integer }
            nombre: { type: string }
            apellidos: { type: string }
        creado_en: { type: string }
    ErrorCsv:
      type: object
      properties:
        fila: { type: [integer, "null"], description: Numeración de Excel (la cabecera es la 1); null = error del archivo }
        columna: { type: [string, "null"] }
        motivo: { type: string }
    ResumenImportacion:
      type: object
      properties:
        simulado: { type: boolean }
        valido: { type: boolean }
        filas: { type: integer, description: Filas de datos leídas }
        altas: { type: integer }
        cambios: { type: integer }
        sin_cambios: { type: integer }
        errores: { type: array, items: { $ref: '#/components/schemas/ErrorCsv' } }
    Checkin:
      type: object
      description: Check-in propio. La nota solo la recibe su autor (LEG-003).
      properties:
        fecha: { type: string, format: date }
        animo: { type: integer, minimum: 1, maximum: 5 }
        energia: { type: integer, minimum: 1, maximum: 5 }
        estres: { type: integer, minimum: 1, maximum: 5, description: 5 = mucho estrés }
        indice: { type: integer, minimum: 0, maximum: 100, description: 'Media de ánimo, energía y (6 − estrés), escalada a 0–100' }
        nota: { type: [string, 'null'] }
    Apoyo:
      type: [object, 'null']
      description: Mensaje de apoyo ante valores bajos (RF-055). Sin intervención automática.
      properties:
        mensaje: { type: string }
        recursos:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              detalle: { type: string }
              telefono: { type: [string, 'null'], example: '024' }
    NivelBienestar:
      type: string
      enum: [BUENO, ATENCION, BAJO]
      description: 'BUENO ≥ 65 · ATENCION 45–64 · BAJO < 45. Se muestra siempre con texto e icono (RNF-044).'
    SemanaBienestar:
      type: object
      description: Por debajo del umbral de anonimato (5 personas) todos los valores y el recuento son null (LEG-002).
      properties:
        semana: { type: string, format: date, description: Lunes de la semana (hora de España) }
        en_curso: { type: boolean }
        disponible: { type: boolean }
        participantes: { type: [integer, 'null'] }
        indice: { type: [integer, 'null'] }
        animo: { type: [number, 'null'] }
        energia: { type: [number, 'null'] }
        estres: { type: [number, 'null'] }
    ResumenBienestar:
      type: object
      properties:
        umbral_anonimato: { type: integer, example: 5 }
        ambito:
          type: object
          properties:
            tipo: { type: string, enum: [EMPRESA, EQUIPO] }
            equipo_id: { type: [integer, 'null'] }
            nombre: { type: string }
        semanas: { type: array, items: { $ref: '#/components/schemas/SemanaBienestar' } }
        actual:
          type: [object, 'null']
          description: Semana más reciente con datos suficientes; null si ninguna supera el umbral (PH-WB-001 en meta.aviso)
          properties:
            semana: { type: string, format: date }
            en_curso: { type: boolean }
            indice: { type: integer }
            nivel: { $ref: '#/components/schemas/NivelBienestar' }
            variacion: { type: [integer, 'null'], description: Puntos frente a la semana anterior con datos }
            participantes: { type: integer }
            plantilla: { type: integer, description: Empleados de alta en el ámbito }
            animo: { type: number }
            energia: { type: number }
            estres: { type: number }
        equipos:
          type: array
          description: Solo en la vista de empresa; últimas 4 semanas
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              disponible: { type: boolean }
              participantes: { type: [integer, 'null'] }
              indice: { type: [integer, 'null'] }
              animo: { type: [number, 'null'] }
              energia: { type: [number, 'null'] }
              estres: { type: [number, 'null'] }
              nivel: { oneOf: [{ $ref: '#/components/schemas/NivelBienestar' }, { type: 'null' }] }
    Alerta:
      type: object
      properties:
        id: { type: integer }
        tipo: { type: string, enum: [BIENESTAR_EQUIPO, RIESGO_ROTACION, FORMACION_VENCIDA] }
        entidad: { type: string, enum: [EQUIPO, USUARIO] }
        entidad_id: { type: integer }
        entidad_nombre: { type: [string, 'null'] }
        severidad: { type: string, enum: [ALTA, MEDIA, BAJA] }
        mensaje: { type: string }
        estado: { type: string, enum: [ABIERTA, GESTIONADA, DESCARTADA] }
        creado_en: { type: string, format: date-time }
        gestion:
          type: [object, 'null']
          properties:
            por: { type: [string, 'null'] }
            en: { type: string, format: date-time }
            nota: { type: [string, 'null'] }
    Categoria: { type: string, enum: [CONDUCCION, ALMACEN, CLIENTE, BIENESTAR, DESARROLLO] }
    Nivel: { type: string, enum: [BASICO, INTERMEDIO, AVANZADO] }
    Bloque:
      description: 'Bloque de un micro-módulo (RF-041). Las ilustraciones son composiciones de marca locales por categoría.'
      oneOf:
        - { type: object, required: [tipo, titulo, texto], properties: { tipo: { const: texto }, titulo: { type: string, maxLength: 80 }, texto: { type: string, maxLength: 1200 } } }
        - { type: object, required: [tipo, titulo, items], properties: { tipo: { const: lista }, titulo: { type: string, maxLength: 80 }, items: { type: array, minItems: 1, maxItems: 8, items: { type: string, maxLength: 200 } } } }
        - { type: object, required: [tipo, texto], properties: { tipo: { const: consejo }, texto: { type: string, maxLength: 300 } } }
        - { type: object, required: [tipo, ilustracion, alt], properties: { tipo: { const: imagen }, ilustracion: { $ref: '#/components/schemas/Categoria' }, alt: { type: string, maxLength: 150 } } }
    Modulo:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        titulo: { type: string }
        resumen: { type: string }
        categoria: { $ref: '#/components/schemas/Categoria' }
        nivel: { $ref: '#/components/schemas/Nivel' }
        puestos_destino: { type: array, items: { type: string } }
        etiquetas: { type: array, items: { type: string } }
        duracion_min: { type: integer, minimum: 1, maximum: 15 }
        estado: { type: string, enum: [BORRADOR, PUBLICADO, ARCHIVADO] }
        version: { type: integer }
        propio: { type: boolean, description: 'true = módulo de la empresa (RF-046); false = catálogo global' }
        bloques: { type: integer, description: Número de bloques }
    ModuloDetalle:
      allOf:
        - { $ref: '#/components/schemas/Modulo' }
        - type: object
          properties:
            contenido:
              type: object
              properties:
                objetivos: { type: array, items: { type: string } }
                bloques: { type: array, items: { $ref: '#/components/schemas/Bloque' } }
            preguntas:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  orden: { type: integer }
                  enunciado: { type: string }
                  opciones: { type: array, items: { type: string } }
                  correcta: { type: integer, description: 'Solo en la vista de gestión; nunca en /v1/me/training/{id}' }
    ModuloEntrada:
      type: object
      required: [titulo, resumen, categoria, duracion_min, contenido, preguntas]
      properties:
        titulo: { type: string, minLength: 3, maxLength: 150 }
        resumen: { type: string, minLength: 10, maxLength: 300 }
        categoria: { $ref: '#/components/schemas/Categoria' }
        nivel: { $ref: '#/components/schemas/Nivel' }
        duracion_min: { type: integer, minimum: 1, maximum: 15 }
        puestos_destino: { type: array, items: { type: string, enum: [CONDUCTOR, REPARTIDOR, MOZO_ALMACEN, COORDINADOR, ADMINISTRATIVO, OTRO] } }
        etiquetas: { type: array, maxItems: 8, items: { type: string, maxLength: 30 } }
        contenido:
          type: object
          required: [objetivos, bloques]
          properties:
            objetivos: { type: array, minItems: 1, maxItems: 5, items: { type: string, maxLength: 200 } }
            bloques: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/Bloque' } }
        preguntas:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: object
            required: [enunciado, opciones, correcta]
            properties:
              enunciado: { type: string, maxLength: 300 }
              opciones: { type: array, minItems: 2, maxItems: 4, items: { type: string, maxLength: 150 } }
              correcta: { type: integer, minimum: 0 }
    Asignacion:
      type: object
      properties:
        id: { type: integer }
        origen: { type: string, enum: [GESTION, AUTOINSCRIPCION, ASESOR_IA] }
        estado: { type: string, enum: [PENDIENTE, EN_CURSO, COMPLETADA, VENCIDA], description: 'VENCIDA = no completada con la fecha límite pasada (estado efectivo)' }
        fecha_limite: { type: [string, 'null'], format: date, description: 'null en autoinscripciones (RF-047)' }
        progreso_pct: { type: integer, minimum: 0, maximum: 100 }
        bloque_actual: { type: integer }
        intentos: { type: integer }
        mejor_nota: { type: [integer, 'null'] }
        ultima_nota: { type: [integer, 'null'] }
        completada_en: { type: [string, 'null'], format: date-time }
        asignada_en: { type: string, format: date-time }
        modulo:
          type: object
          properties:
            id: { type: integer }
            codigo: { type: string }
            titulo: { type: string }
            resumen: { type: string }
            categoria: { $ref: '#/components/schemas/Categoria' }
            nivel: { $ref: '#/components/schemas/Nivel' }
            duracion_min: { type: integer }
        empleado:
          type: object
          description: Solo en las vistas de gestión
          properties:
            id: { type: integer }
            nombre: { type: string }
            apellidos: { type: [string, 'null'] }
            puesto: { type: [string, 'null'] }
            equipo_id: { type: [integer, 'null'] }
            equipo_nombre: { type: [string, 'null'] }
    Recomendacion:
      type: object
      properties:
        empleado: { type: object, properties: { id: { type: integer }, nombre: { type: string }, apellidos: { type: string }, puesto: { type: string }, equipo_id: { type: [integer, 'null'] }, equipo_nombre: { type: [string, 'null'] } } }
        modulo: { type: object, properties: { id: { type: integer }, codigo: { type: string }, titulo: { type: string }, categoria: { $ref: '#/components/schemas/Categoria' }, duracion_min: { type: integer } } }
        regla: { type: string, enum: [SINIESTRO, QUEJA_CLIENTE, BIENESTAR_EQUIPO, ACOGIDA] }
        motivo: { type: string }
    Preferencias:
      type: object
      description: 'Preferencias para el asesor (LEG-014: solo las ve el empleado)'
      properties:
        objetivo: { type: string, enum: [MEJORAR_TRABAJO, SEGURIDAD, SALUD_ENERGIA, RESPONSABILIDAD, HERRAMIENTAS_DIGITALES] }
        intereses: { type: array, items: { $ref: '#/components/schemas/Categoria' } }
        formato: { type: string, enum: [TEXTO, IMAGENES, VIDEO] }
        minutos_semana: { type: integer, enum: [5, 15, 30] }
        comentario: { type: [string, 'null'], maxLength: 200, description: 'Pasa por el PayloadGuard: sin emails, teléfonos, DNI/NIE, nombres de la empresa ni datos de salud (PH-AI-004)' }
    RespuestaAsesor:
      type: object
      properties:
        solicitud_id: { type: integer }
        servido_desde: { type: string, enum: [live, cache, reglas], description: IA-015 }
        generado_con_ia: { type: boolean, description: 'false = "Recomendación automática sin IA" (IA-002, IA-018)' }
        recomendaciones:
          type: array
          minItems: 3
          maxItems: 5
          items:
            type: object
            properties:
              orden: { type: integer }
              motivo: { type: string, maxLength: 160 }
              origen: { type: string, enum: [IA, REGLAS] }
              modulo: { type: object, properties: { id: { type: integer }, titulo: { type: string }, resumen: { type: string }, categoria: { $ref: '#/components/schemas/Categoria' }, nivel: { $ref: '#/components/schemas/Nivel' }, duracion_min: { type: integer } } }
              asignacion: { type: [object, 'null'], properties: { id: { type: integer }, estado: { type: string }, origen: { type: string } } }
        plan_semanal: { type: string, maxLength: 300 }
    Factor:
      type: object
      description: Factor del motor de riesgo con su explicación (RF-032, RF-034)
      properties:
        codigo: { type: string, enum: [F1, F2, F3, F4, F5, F6, F7] }
        nombre: { type: string }
        puntos: { type: integer, description: 'Negativo en F7 (reconocimiento)' }
        detalle: { type: string, description: Frase en lenguaje llano }
        evidencia: { type: string }
        fuentes: { type: array, items: { type: string, example: S3 } }
    NivelRiesgo: { type: string, enum: [BAJO, MEDIO, ALTO], description: 'bajo 0–29 · medio 30–54 · alto 55–100 (RF-033)' }
    PuntuacionRiesgo:
      type: object
      properties:
        empleado:
          type: object
          properties:
            id: { type: integer }
            nombre: { type: string }
            apellidos: { type: [string, 'null'] }
            puesto: { type: string }
            turno: { type: string }
            tipo_contrato: { type: string }
            fecha_alta: { type: string, format: date }
            equipo_id: { type: [integer, 'null'] }
            equipo_nombre: { type: [string, 'null'] }
        fecha: { type: string, format: date }
        puntuacion: { type: integer, minimum: 0, maximum: 100 }
        nivel: { $ref: '#/components/schemas/NivelRiesgo' }
        factores: { type: array, items: { $ref: '#/components/schemas/Factor' } }
        version_reglas: { type: string, example: v1.1 }
    LineaBase:
      type: object
      properties:
        linea_base:
          type: [object, 'null']
          properties:
            periodo_inicio: { type: string, format: date }
            periodo_fin: { type: string, format: date }
            plantilla_media: { type: number }
            bajas_voluntarias: { type: integer }
            dias_absentismo: { type: integer, description: Días de ausencia injustificada (sin bajas médicas) }
            fuente: { type: [string, 'null'] }
            rotacion_voluntaria: { type: number, description: '%' }
            absentismo_por_persona: { type: number }
        actual:
          type: object
          properties:
            desde: { type: string, format: date, description: Alta de la empresa en Pyme Hub }
            dias: { type: integer }
            plantilla_media: { type: number }
            bajas_voluntarias: { type: integer }
            rotacion_voluntaria_anualizada: { type: number }
            dias_absentismo: { type: integer }
            absentismo_anualizado_por_persona: { type: number }
        comparacion:
          type: [object, 'null']
          properties:
            rotacion_relativa: { type: [number, 'null'], description: '% de variación frente a la línea base' }
            absentismo_relativo: { type: [number, 'null'] }
            objetivo_piloto: { type: integer, example: -15 }
            periodo_corto: { type: boolean, description: Menos de 90 días desde el alta }
paths:
  /v1/health:
    get:
      summary: Estado de la API (RNF-061)
      responses:
        '200': { description: ok o degradado }
        '503': { description: base de datos caída }
  /v1/auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Sesión iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { description: PH-AUTH-001 }
        '429': { description: PH-AUTH-004 }
  /v1/auth/me:
    get:
      summary: Usuario, interlocutor, plan, funcionalidades y token CSRF
      security: [{ sesion: [] }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { description: PH-AUTH-002 }
  /v1/auth/logout:
    post:
      summary: Cerrar sesión
      security: [{ sesion: [], csrf: [] }]
