      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Incidencia' } }
                  meta: { $ref: '#/components/schemas/Paginacion' }
