      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ModuloDetalle' } } } }
        '403': { description: PH-PERM-001 (el catálogo global no se edita) }
        '422': { description: PH-VAL-001 }
