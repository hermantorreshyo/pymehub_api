openapi: 3.1.0
info:
  title: Pyme Hub API
  version: 0.4.0
  description: |
    Contrato entre pymehub_api y pymehub_web (DEC-13).
    Autenticación por cookie de sesión HttpOnly. Toda petición que modifica datos
    exige la cabecera X-CSRF-Token con el valor devuelto por /v1/auth/me o /v1/auth/login.
    Errores: { "error": { "code": "PH-…", "message", "details", "correlation_id" } }.
    Listados paginados: ?page=&per_page= (máx. 100); meta = { total, page, per_page }.
servers:
  - url: https://api.pymehub.hermantorres.com
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: PHSESSID
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: PH-AUTH-001 }
            message: { type: string }
            details: { type: object }
            correlation_id: { type: string }
    Me:
      type: object
      properties:
        usuario:
          type: object
          properties:
            id: { type: integer }
            nombre: { type: string }
            apellidos: { type: string }
            email: { type: string }
            perfil: { type: string, enum: [ADMIN, GERENTE, RRHH, EMPLEADO] }
        interlocutor:
          type: object
          properties:
            id: { type: integer }
            tipo: { type: string, enum: [PLATAFORMA, EMPRESA, FORMADOR] }
            nombre: { type: string }
            estado: { type: string }
        plan: { type: [string, "null"], enum: [ENTRADA, COMPLETO, null] }
        features: { type: array, items: { type: string } }
        csrf_token: { type: string }
        sesion:
          type: object
          properties:
            inactividad_max_seg: { type: integer }
    Invitacion:
      type: object
      properties:
        enlace: { type: string }
        expira_en: { type: string, format: date-time }
    EmpresaAlta:
      type: object
      required: [nombre, nif, plan, ciclo_cobro, gerente]
      properties:
        nombre: { type: string }
        nombre_comercial: { type: string }
        nif: { type: string }
        sector: { type: string }
        email_contacto: { type: string }
        telefono_contacto: { type: string }
        plan: { type: string, enum: [ENTRADA, COMPLETO] }
        ciclo_cobro: { type: string, enum: [MENSUAL, ANUAL] }
        limite_empleados: { type: integer, maximum: 250 }
        fecha_contrato_encargado: { type: string, format: date }
        estado: { type: string, enum: [PILOTO, ACTIVO] }
        gerente:
          type: object
          required: [nombre, email]
          properties:
            nombre: { type: string }
            apellidos: { type: string }
            email: { type: string }
    Paginacion:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
    Equipo:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        zona: { type: [string, "null"] }
        responsable:
          type: [object, "null"]
          properties:
            id: { type: integer }
            nombre: { type: string }
            apellidos: { type: string }
        empleados: { type: integer, description: Empleados de alta en el equipo }
        creado_en: { type: string }
    EquipoEntrada:
      type: object
      properties:
        nombre: { type: string, minLength: 2, maxLength: 80, description: Obligatorio al crear; único entre los equipos vigentes }
        zona: { type: [string, "null"], maxLength: 80 }
        responsable_usuario_id: { type: [integer, "null"], description: Usuario de la misma empresa }
    Puesto: { type: string, enum: [CONDUCTOR, REPARTIDOR, MOZO_ALMACEN, COORDINADOR, ADMINISTRATIVO, OTRO] }
    TipoContrato: { type: string, enum: [INDEFINIDO, TEMPORAL, ETT] }
    Turno: { type: string, enum: [MANANA, TARDE, NOCHE, ROTATIVO] }
    Empleado:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        apellidos: { type: string }
        email: { type: [string, "null"] }
        estado_acceso: { type: string, enum: [SIN_ACCESO, INVITADO, ACTIVO, BLOQUEADO, BAJA] }
        codigo_interno: { type: [string, "null"] }
        puesto: { $ref: '#/components/schemas/Puesto' }
        tipo_contrato: { $ref: '#/components/schemas/TipoContrato' }
        turno: { $ref: '#/components/schemas/Turno' }
        fecha_alta: { type: string, format: date }
        fecha_baja: { type: [string, "null"], format: date }
        motivo_baja: { type: [string, "null"], enum: [VOLUNTARIA, NO_VOLUNTARIA, FIN_CONTRATO, null] }
        equipo:
          type: [object, "null"]
          properties:
            id: { type: integer }
            nombre: { type: string }
        ultimo_acceso_en: { type: [string, "null"] }
        creado_en: { type: string }
    EmpleadoEntrada:
      type: object
      description: |
        En el alta son obligatorios nombre, puesto, tipo_contrato, turno y fecha_alta.
        En PATCH todos son opcionales; los obligatorios no pueden quedar vacíos.
        El email solo se cambia mientras la cuenta está en SIN_ACCESO o INVITADO.
      properties:
        nombre: { type: string, minLength: 2, maxLength: 80 }
        apellidos: { type: [string, "null"], maxLength: 120 }
        email: { type: [string, "null"], format: email, description: Opcional hasta invitarle; único en la plataforma }
        codigo_interno: { type: [string, "null"], maxLength: 30, description: Único en la empresa }
        puesto: { $ref: '#/components/schemas/Puesto' }
        tipo_contrato: { $ref: '#/components/schemas/TipoContrato' }
        turno: { $ref: '#/components/schemas/Turno' }
        fecha_alta: { type: string, format: date }
        equipo_id: { type: [integer, "null"] }
    TipoIncidencia:
      type: string
      description: LEG-012 · solo ausencias injustificadas; nunca bajas médicas ni su causa
      enum: [AUSENCIA_INJUSTIFICADA, RETRASO, SINIESTRO, QUEJA_CLIENTE, RECONOCIMIENTO]
    Incidencia:
      type: object
      properties:
        id: { type: integer }
        empleado_id: { type: integer }
        tipo: { $ref: '#/components/schemas/TipoIncidencia' }
        fecha: { type: string, format: date }
        nota: { type: [string, "null"] }
        registrada_por:
          type: [object, "null"]
          properties:
            id: { type: integer }
            nombre: { type: string }
            apellidos: { type: string }
        creado_en: { type: string }
    ErrorCsv:
      type: object
      properties:
        fila: { type: [integer, "null"], description: Numeración de Excel (la cabecera es la 1); null = error del archivo }
        columna: { type: [string, "null"] }
        motivo: { type: string }
    ResumenImportacion:
      type: object
      properties:
        simulado: { type: boolean }
        valido: { type: boolean }
        filas: { type: integer, description: Filas de datos leídas }
        altas: { type: integer }
        cambios: { type: integer }
        sin_cambios: { type: integer }
        errores: { type: array, items: { $ref: '#/components/schemas/ErrorCsv' } }
    Checkin:
      type: object
      description: Check-in propio. La nota solo la recibe su autor (LEG-003).
      properties:
        fecha: { type: string, format: date }
        animo: { type: integer, minimum: 1, maximum: 5 }
        energia: { type: integer, minimum: 1, maximum: 5 }
        estres: { type: integer, minimum: 1, maximum: 5, description: 5 = mucho estrés }
        indice: { type: integer, minimum: 0, maximum: 100, description: 'Media de ánimo, energía y (6 − estrés), escalada a 0–100' }
        nota: { type: [string, 'null'] }
    Apoyo:
      type: [object, 'null']
      description: Mensaje de apoyo ante valores bajos (RF-055). Sin intervención automática.
      properties:
        mensaje: { type: string }
        recursos:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string }
              detalle: { type: string }
              telefono: { type: [string, 'null'], example: '024' }
    NivelBienestar:
      type: string
      enum: [BUENO, ATENCION, BAJO]
      description: 'BUENO ≥ 65 · ATENCION 45–64 · BAJO < 45. Se muestra siempre con texto e icono (RNF-044).'
    SemanaBienestar:
      type: object
      description: Por debajo del umbral de anonimato (5 personas) todos los valores y el recuento son null (LEG-002).
      properties:
        semana: { type: string, format: date, description: Lunes de la semana (hora de España) }
        en_curso: { type: boolean }
        disponible: { type: boolean }
        participantes: { type: [integer, 'null'] }
        indice: { type: [integer, 'null'] }
        animo: { type: [number, 'null'] }
        energia: { type: [number, 'null'] }
        estres: { type: [number, 'null'] }
    ResumenBienestar:
      type: object
      properties:
        umbral_anonimato: { type: integer, example: 5 }
        ambito:
          type: object
          properties:
            tipo: { type: string, enum: [EMPRESA, EQUIPO] }
            equipo_id: { type: [integer, 'null'] }
            nombre: { type: string }
        semanas: { type: array, items: { $ref: '#/components/schemas/SemanaBienestar' } }
        actual:
          type: [object, 'null']
          description: Semana más reciente con datos suficientes; null si ninguna supera el umbral (PH-WB-001 en meta.aviso)
          properties:
            semana: { type: string, format: date }
            en_curso: { type: boolean }
            indice: { type: integer }
            nivel: { $ref: '#/components/schemas/NivelBienestar' }
            variacion: { type: [integer, 'null'], description: Puntos frente a la semana anterior con datos }
            participantes: { type: integer }
            plantilla: { type: integer, description: Empleados de alta en el ámbito }
            animo: { type: number }
            energia: { type: number }
            estres: { type: number }
        equipos:
          type: array
          description: Solo en la vista de empresa; últimas 4 semanas
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              disponible: { type: boolean }
              participantes: { type: [integer, 'null'] }
              indice: { type: [integer, 'null'] }
              animo: { type: [number, 'null'] }
              energia: { type: [number, 'null'] }
              estres: { type: [number, 'null'] }
              nivel: { oneOf: [{ $ref: '#/components/schemas/NivelBienestar' }, { type: 'null' }] }
    Alerta:
      type: object
      properties:
        id: { type: integer }
        tipo: { type: string, enum: [BIENESTAR_EQUIPO, RIESGO_ROTACION, FORMACION_VENCIDA] }
        entidad: { type: string, enum: [EQUIPO, USUARIO] }
        entidad_id: { type: integer }
        entidad_nombre: { type: [string, 'null'] }
        severidad: { type: string, enum: [ALTA, MEDIA, BAJA] }
        mensaje: { type: string }
        estado: { type: string, enum: [ABIERTA, GESTIONADA, DESCARTADA] }
        creado_en: { type: string, format: date-time }
        gestion:
          type: [object, 'null']
          properties:
            por: { type: [string, 'null'] }
            en: { type: string, format: date-time }
            nota: { type: [string, 'null'] }
    Categoria: { type: string, enum: [CONDUCCION, ALMACEN, CLIENTE, BIENESTAR, DESARROLLO] }
    Nivel: { type: string, enum: [BASICO, INTERMEDIO, AVANZADO] }
    Bloque:
      description: 'Bloque de un micro-módulo (RF-041). Las ilustraciones son composiciones de marca locales por categoría.'
      oneOf:
        - { type: object, required: [tipo, titulo, texto], properties: { tipo: { const: texto }, titulo: { type: string, maxLength: 80 }, texto: { type: string, maxLength: 1200 } } }
        - { type: object, required: [tipo, titulo, items], properties: { tipo: { const: lista }, titulo: { type: string, maxLength: 80 }, items: { type: array, minItems: 1, maxItems: 8, items: { type: string, maxLength: 200 } } } }
        - { type: object, required: [tipo, texto], properties: { tipo: { const: consejo }, texto: { type: string, maxLength: 300 } } }
        - { type: object, required: [tipo, ilustracion, alt], properties: { tipo: { const: imagen }, ilustracion: { $ref: '#/components/schemas/Categoria' }, alt: { type: string, maxLength: 150 } } }
    Modulo:
      type: object
      properties:
        id: { type: integer }
        codigo: { type: string }
        titulo: { type: string }
        resumen: { type: string }
        categoria: { $ref: '#/components/schemas/Categoria' }
        nivel: { $ref: '#/components/schemas/Nivel' }
        puestos_destino: { type: array, items: { type: string } }
        etiquetas: { type: array, items: { type: string } }
        duracion_min: { type: integer, minimum: 1, maximum: 15 }
        estado: { type: string, enum: [BORRADOR, PUBLICADO, ARCHIVADO] }
        version: { type: integer }
        propio: { type: boolean, description: 'true = módulo de la empresa (RF-046); false = catálogo global' }
        bloques: { type: integer, description: Número de bloques }
    ModuloDetalle:
      allOf:
        - { $ref: '#/components/schemas/Modulo' }
        - type: object
          properties:
            contenido:
              type: object
              properties:
                objetivos: { type: array, items: { type: string } }
                bloques: { type: array, items: { $ref: '#/components/schemas/Bloque' } }
            preguntas:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  orden: { type: integer }
                  enunciado: { type: string }
                  opciones: { type: array, items: { type: string } }
                  correcta: { type: integer, description: 'Solo en la vista de gestión; nunca en /v1/me/training/{id}' }
    ModuloEntrada:
      type: object
      required: [titulo, resumen, categoria, duracion_min, contenido, preguntas]
      properties:
        titulo: { type: string, minLength: 3, maxLength: 150 }
        resumen: { type: string, minLength: 10, maxLength: 300 }
        categoria: { $ref: '#/components/schemas/Categoria' }
        nivel: { $ref: '#/components/schemas/Nivel' }
        duracion_min: { type: integer, minimum: 1, maximum: 15 }
        puestos_destino: { type: array, items: { type: string, enum: [CONDUCTOR, REPARTIDOR, MOZO_ALMACEN, COORDINADOR, ADMINISTRATIVO, OTRO] } }
        etiquetas: { type: array, maxItems: 8, items: { type: string, maxLength: 30 } }
        contenido:
          type: object
          required: [objetivos, bloques]
          properties:
            objetivos: { type: array, minItems: 1, maxItems: 5, items: { type: string, maxLength: 200 } }
            bloques: { type: array, minItems: 1, maxItems: 8, items: { $ref: '#/components/schemas/Bloque' } }
        preguntas:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: object
            required: [enunciado, opciones, correcta]
            properties:
              enunciado: { type: string, maxLength: 300 }
              opciones: { type: array, minItems: 2, maxItems: 4, items: { type: string, maxLength: 150 } }
              correcta: { type: integer, minimum: 0 }
    Asignacion:
      type: object
      properties:
        id: { type: integer }
        origen: { type: string, enum: [GESTION, AUTOINSCRIPCION, ASESOR_IA] }
        estado: { type: string, enum: [PENDIENTE, EN_CURSO, COMPLETADA, VENCIDA], description: 'VENCIDA = no completada con la fecha límite pasada (estado efectivo)' }
        fecha_limite: { type: [string, 'null'], format: date, description: 'null en autoinscripciones (RF-047)' }
        progreso_pct: { type: integer, minimum: 0, maximum: 100 }
        bloque_actual: { type: integer }
        intentos: { type: integer }
        mejor_nota: { type: [integer, 'null'] }
        ultima_nota: { type: [integer, 'null'] }
        completada_en: { type: [string, 'null'], format: date-time }
        asignada_en: { type: string, format: date-time }
        modulo:
          type: object
          properties:
            id: { type: integer }
            codigo: { type: string }
            titulo: { type: string }
            resumen: { type: string }
            categoria: { $ref: '#/components/schemas/Categoria' }
            nivel: { $ref: '#/components/schemas/Nivel' }
            duracion_min: { type: integer }
        empleado:
          type: object
          description: Solo en las vistas de gestión
          properties:
            id: { type: integer }
            nombre: { type: string }
            apellidos: { type: [string, 'null'] }
            puesto: { type: [string, 'null'] }
            equipo_id: { type: [integer, 'null'] }
            equipo_nombre: { type: [string, 'null'] }
    Recomendacion:
      type: object
      properties:
        empleado: { type: object, properties: { id: { type: integer }, nombre: { type: string }, apellidos: { type: string }, puesto: { type: string }, equipo_id: { type: [integer, 'null'] }, equipo_nombre: { type: [string, 'null'] } } }
        modulo: { type: object, properties: { id: { type: integer }, codigo: { type: string }, titulo: { type: string }, categoria: { $ref: '#/components/schemas/Categoria' }, duracion_min: { type: integer } } }
        regla: { type: string, enum: [SINIESTRO, QUEJA_CLIENTE, BIENESTAR_EQUIPO, ACOGIDA] }
        motivo: { type: string }
paths:
  /v1/health:
    get:
      summary: Estado de la API (RNF-061)
      responses:
        '200': { description: ok o degradado }
        '503': { description: base de datos caída }
  /v1/auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Sesión iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { description: PH-AUTH-001 }
        '429': { description: PH-AUTH-004 }
  /v1/auth/me:
    get:
      summary: Usuario, interlocutor, plan, funcionalidades y token CSRF
      security: [{ sesion: [] }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { description: PH-AUTH-002 }
  /v1/auth/logout:
    post:
      summary: Cerrar sesión
      security: [{ sesion: [], csrf: [] }]
      responses:
        '204': { description: Sesión cerrada }
  /v1/auth/invitations/accept:
    post:
      summary: Activar la cuenta con el token de invitación
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, password, acepta_privacidad]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10 }
                acepta_privacidad: { type: boolean }
      responses:
        '200': { description: Cuenta activada }
        '410': { description: PH-AUTH-005 }
  /v1/admin/tenants:
    get:
      summary: Empresas cliente (perfil ADMIN)
      security: [{ sesion: [] }]
      responses: { '200': { description: ok } }
    post:
      summary: Alta de empresa con suscripción y gerente invitado (perfil ADMIN)
      security: [{ sesion: [], csrf: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/EmpresaAlta' } } }
      responses:
        '201': { description: Creada; incluye invitacion_gerente }
        '409': { description: NIF o email duplicado }
        '422': { description: PH-VAL-001 }
  /v1/admin/tenants/{id}:
    get:
      summary: Detalle de empresa con sus usuarios de gestión (perfil ADMIN)
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok }, '404': { description: PH-TENANT-001 } }
    patch:
      summary: Datos, estado, plan, ciclo de cobro, límites (perfil ADMIN)
      description: Un cambio de plan o de ciclo cierra la suscripción vigente y abre otra.
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok } }
  /v1/admin/metrics:
    get:
      summary: Empresas por estado y MRR teórico por plan (perfil ADMIN)
      security: [{ sesion: [] }]
      responses: { '200': { description: ok } }
  /v1/users:
    get:
      summary: Cuentas de gestión de la empresa (perfil GERENTE)
      security: [{ sesion: [] }]
      responses: { '200': { description: ok } }
    post:
      summary: Crear cuenta de RR. HH. e invitar (perfil GERENTE)
      security: [{ sesion: [], csrf: [] }]
      responses: { '201': { description: Creada; incluye invitacion } }
  /v1/users/{id}:
    patch:
      summary: Editar, bloquear o reactivar una cuenta de RR. HH. (perfil GERENTE)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '200': { description: ok }, '404': { description: PH-TENANT-001 } }
    delete:
      summary: Baja de la cuenta de RR. HH. (perfil GERENTE)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: Baja realizada } }
  /v1/users/{id}/invitation:
    post:
      summary: Generar un nuevo enlace de invitación (perfil GERENTE)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '201': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Invitacion' } } } } }
  /v1/teams:
    get:
      summary: Equipos de la empresa (GERENTE, RRHH)
      security: [{ sesion: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Equipo' } }
    post:
      summary: Crear equipo (GERENTE)
      security: [{ sesion: [], csrf: [] }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EquipoEntrada' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Equipo' } } } }
        '403': { description: PH-PERM-001 (RRHH) }
        '409': { description: PH-VAL-001 nombre duplicado }
        '422': { description: PH-VAL-001 }
  /v1/teams/{id}:
    patch:
      summary: Editar equipo (GERENTE)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EquipoEntrada' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Equipo' } } } }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 nombre duplicado }
    delete:
      summary: Borrar equipo (GERENTE, borrado lógico)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '204': { description: Borrado }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 el equipo tiene empleados de alta }
  /v1/employees:
    get:
      summary: Plantilla de la empresa (GERENTE, RRHH)
      security: [{ sesion: [] }]
      parameters:
        - { name: situacion, in: query, schema: { type: string, enum: [ALTA, BAJA, TODAS], default: ALTA } }
        - { name: equipo_id, in: query, schema: { type: integer } }
        - { name: q, in: query, description: Busca en nombre, apellidos, código interno y email, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Empleado' } }
                  meta: { $ref: '#/components/schemas/Paginacion' }
    post:
      summary: Alta de empleado en SIN_ACCESO (GERENTE, RRHH · RF-021)
      security: [{ sesion: [], csrf: [] }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmpleadoEntrada' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Empleado' } } } }
        '409': { description: PH-TENANT-002 límite del plan · PH-VAL-001 email o código interno duplicado }
        '422': { description: PH-VAL-001 }
  /v1/employees/import:
    post:
      summary: Importar la plantilla por CSV, todo o nada (GERENTE, RRHH · RF-020)
      description: |
        Cuerpo: el archivo tal cual, con Content-Type text/csv. UTF-8, separador ";" o ",",
        cabecera en la primera fila, máximo 1 MB y 250 filas.
        Columnas: codigo_interno*, nombre*, apellidos, email, puesto*, tipo_contrato*, turno*,
        fecha_alta* (AAAA-MM-DD o DD/MM/AAAA), equipo (nombre de un equipo existente).
        codigo_interno existente = cambio de la ficha; nuevo = alta en SIN_ACCESO. No crea invitaciones.
        Ejemplo: docs/ejemplos/plantilla_empleados.csv
      security: [{ sesion: [], csrf: [] }]
      parameters:
        - name: simular
          in: query
          description: 1 = valida y devuelve el resumen sin escribir (con errores responde 200 y valido=false)
          schema: { type: string, enum: ['0', '1'] }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '200': { description: Importado o simulado, content: { application/json: { schema: { $ref: '#/components/schemas/ResumenImportacion' } } } }
        '409': { description: PH-TENANT-002 las altas superan el límite del plan }
        '415': { description: PH-VAL-001 el cuerpo no es text/csv }
        '422':
          description: PH-VAL-002 · no se ha importado ninguna fila
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, example: PH-VAL-002 }
                      message: { type: string }
                      details:
                        type: object
                        properties:
                          errores: { type: array, items: { $ref: '#/components/schemas/ErrorCsv' } }
                      correlation_id: { type: string }
  /v1/employees/{id}:
    get:
      summary: Ficha del empleado (GERENTE, RRHH)
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Empleado' } } } }
        '404': { description: PH-TENANT-001 }
    patch:
      summary: Editar la ficha (GERENTE, RRHH)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/EmpleadoEntrada' } } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Empleado' } } } }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 empleado dado de baja, email o código duplicado }
        '422': { description: PH-VAL-001 }
    delete:
      summary: Baja laboral (GERENTE, RRHH · RF-022)
      description: No borra al usuario. Le retira el acceso, anula sus invitaciones y deja la ficha en solo lectura.
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha_baja, motivo_baja]
              properties:
                fecha_baja: { type: string, format: date, description: No futura ni anterior al alta }
                motivo_baja: { type: string, enum: [VOLUNTARIA, NO_VOLUNTARIA, FIN_CONTRATO] }
      responses:
        '200': { description: Baja registrada, content: { application/json: { schema: { $ref: '#/components/schemas/Empleado' } } } }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 ya estaba de baja }
        '422': { description: PH-VAL-001 }
  /v1/employees/{id}/invitation:
    post:
      summary: Invitar al empleado (GERENTE, RRHH · RF-023, LEG-016)
      security: [{ sesion: [], csrf: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, description: Obligatorio si el empleado aún no tiene email }
      responses:
        '201': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Invitacion' } } } }
        '403': { description: PH-TENANT-003 falta el contrato de encargado del tratamiento }
        '404': { description: PH-TENANT-001 }
        '409': { description: PH-VAL-001 empleado de baja o email duplicado }
        '422': { description: PH-VAL-001 sin email, cuenta ya activa o bloqueada }
  /v1/employees/{id}/incidents:
    get:
      summary: Incidencias del empleado (GERENTE, RRHH)
      security: [{ sesion: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoIncidencia' } }
