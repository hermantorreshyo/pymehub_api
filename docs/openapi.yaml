        - { name: equipo_id, in: query, schema: { type: integer } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: estado, in: query, schema: { type: string, enum: [PENDIENTE, EN_CURSO, COMPLETADA, VENCIDA] } }
        - { name: origen, in: query, schema: { type: string, enum: [GESTION, AUTOINSCRIPCION, ASESOR_IA] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200':
